[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrans"
version = "0.1.0"
description = "ML-augmented RANS modelling of separated flow over periodic hills, validated against DNS."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyvista>=0.43",
    "meshio>=5.3",
    "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
