[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrans"
version = "0.1.0"
description = "ML-augmented RANS modelling of separated flow over periodic hills, validated against DNS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Bainbridge" }]
keywords = [
    "computational-fluid-dynamics",
    "turbulence-modelling",
    "rans",
    "data-driven-closure",
    "separated-flow",
    "openfoam",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "scikit-learn>=0.23",
    "pyvista>=0.43",
    "meshio>=5.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Needed only for the tensor-basis neural network (analysis/13_tbnn.py).
ml = ["torch>=2.0"]
dev = ["pytest>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
